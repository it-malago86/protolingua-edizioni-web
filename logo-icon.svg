<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A6BFF"/>
      <stop offset="100%" stop-color="#6D4AFF"/>
    </linearGradient>
    <linearGradient id="inkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232329"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>

  <!-- right lobe (ink) as full circle base -->
  <circle cx="100" cy="100" r="95" fill="url(#inkGrad)"/>

  <!-- left lobe (violet), wavy divider -->
  <path d="M100,5
           C132,38 72,78 100,100
           C132,122 72,162 100,195
           A95,95 0 0 1 100,5 Z"
        fill="url(#violetGrad)"/>

  <!-- soundwave bars, left (on violet) -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <line x1="46" y1="88" x2="46" y2="112"/>
    <line x1="58" y1="76" x2="58" y2="124"/>
    <line x1="70" y1="64" x2="70" y2="136"/>
    <line x1="82" y1="80" x2="82" y2="120"/>
  </g>

  <!-- soundwave bars, right (on ink) -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.92">
    <line x1="118" y1="80" x2="118" y2="120"/>
    <line x1="130" y1="64" x2="130" y2="136"/>
    <line x1="142" y1="76" x2="142" y2="124"/>
    <line x1="154" y1="88" x2="154" y2="112"/>
  </g>
</svg>
